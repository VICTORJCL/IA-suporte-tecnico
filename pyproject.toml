[project]
name = "ai-it-analyst-agent"
version = "0.1.0"
description = "Agente de suporte técnico do Acelerato"
requires-python = ">=3.13"
dependencies = [
    "agno",
    "openai",
    "tavily-python",
    "sqlalchemy>=2.0.46",
    "fastapi>=0.128.7",
    "uvicorn",
    "python-dotenv",
    "playwright",
    "pandas>=3.0.2",
    "openpyxl",
    "tabulate",
    "requests",
    "schedule>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
